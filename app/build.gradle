plugins {
    // Pinned: the offline local Maven repo has no maven-metadata.xml, so a
    // version-less plugin id fails to resolve.
    id 'com.android.application'
}

android {
    namespace 'com.blackempire.rewards'
    compileSdk 36
    buildToolsVersion "36.1.0"

    // Bump: v5/1.4 — gift-card upgrade (George's rule): $15/$50/$100 rows,
    // brand picker, redeeming opens at 1,000 pts, sign-in required to redeem.
    defaultConfig {
        applicationId 'com.blackempire.rewards'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.4'
    }

    // Permanent debug keystore (see AGENTS.md): never rely on Gradle's
    // auto-generated debug keystore — its signature changes between builds.
    // On GitHub Actions the file doesn't exist, so fall back to Gradle's
    // default debug signing there (Google Sign-In on CI-built APKs needs
    // that keystore's SHA-1 added in Firebase before it will work).
    signingConfigs {
        debug {
            if (file("/home/hatch/workspace/debug.keystore").exists()) {
                storeFile file("/home/hatch/workspace/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/kotlinx_coroutines_core.version', 'META-INF/*.version', 'META-INF/*.kotlin_module']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Unity Ads 4.20.1 — present in the offline local Maven repo with all
    // of its transitive deps. Live since v2: Game ID 800444073,
    // TEST_MODE = false, three placements (rewarded BP_Rewarded_Android,
    // banner Banner_Android, interstitial Interstitial_Android).
    implementation 'com.unity3d.ads:unity-ads:4.20.1'
    // Firebase Auth + Google sign-in (v3) — same versions as Empire
    // Tester's working build; both are in the offline local Maven repo.
    // No Firestore here: points stay local in v1, so no datastore pins
    // are needed (those were for Firestore's transitive datastore).
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
